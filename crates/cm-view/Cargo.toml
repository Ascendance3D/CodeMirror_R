[package]
name = "cm-view"
version = "0.1.0"
description = "Port of the CodeMirror 5 (5.65.21) view + input layer: commands, keymaps, measurement, highlighting, and a native wgpu editor"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gpu", "clipboard-native"]
# The native renderer and the `cm-edit` binary. The editor model (commands, keymap,
# measurement, highlighting, input) builds and tests without it.
gpu = ["dep:wgpu", "dep:glyphon", "dep:winit", "dep:pollster", "dep:png", "dep:bytemuck"]
# The system clipboard through arboard (`native_clipboard`). arboard is a dependency
# only on the desktop targets it supports; on WebAssembly, Android and iOS this
# feature adds nothing and the clipboard stays in memory.
clipboard-native = ["dep:arboard"]

[dependencies]
cm-core = { path = "../cm-core" }
cm-modes = { path = "../cm-modes" }
flate2 = "1"
wgpu = { version = "30", optional = true }
glyphon = { version = "0.12", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
png = { version = "0.18", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3", optional = true, default-features = false }

[dev-dependencies]
cm-evidence = { path = "../cm-evidence" }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "cm-edit"
required-features = ["gpu"]

[[bin]]
name = "cm-render"
required-features = ["gpu"]
